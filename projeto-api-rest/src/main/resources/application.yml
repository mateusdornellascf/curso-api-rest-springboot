cors:
  orginPatterns: http://localhost:8080
file:
  upload-dir: ${UPLOAD_DIR:uploads}
spring:
  application:
    name: projeto_api_rest

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/projeto_api_rest?useTimezone=true&serverTimezone=UTC
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 200MB
      max-request-size: 215MB
      
logging:
  level:
    br.com.mateusdornellascf: DEBUG
springdoc:
  paths-to-match: /api/**/v3/**
  swagger-ui:
    use-root-path: true
